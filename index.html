<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belair Agent Hub</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — navy brand rail on desktop, top bar + bottom tabs on phones; one work surface per screen; Belair Studio and Insights are desktop-first. */
:root{
  --navy:#12234F; --navy-2:#1c3163; --lime:#BFC432; --gold:#C7A233;
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --fg:#1b2333; --muted:#596579; --line:#dde3ec;
  --chip:#eef0cf; --chip-fg:#4a4d00; --sel:#12234F;
  --ok:#1f7a4d; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b3261e; --bad-bg:#fbe5e3;
  --shadow:0 1px 2px rgba(18,35,79,.06),0 8px 24px rgba(18,35,79,.06);
  --font:"Matter","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1228; --surface:#111c3a; --surface-2:#16224a; --fg:#e8ecf5; --muted:#a3aec4; --line:#24325a;
  --chip:#2b3210; --chip-fg:#dfe38a; --sel:#BFC432;
  --ok:#7fd3a4; --ok-bg:#163828; --warn:#f3c26b; --warn-bg:#3a2c10; --bad:#ff9a90; --bad-bg:#3f1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1228; --surface:#111c3a; --surface-2:#16224a; --fg:#e8ecf5; --muted:#a3aec4; --line:#24325a;
  --chip:#2b3210; --chip-fg:#dfe38a; --sel:#BFC432;
  --ok:#7fd3a4; --ok-bg:#163828; --warn:#f3c26b; --warn-bg:#3a2c10; --bad:#ff9a90; --bad-bg:#3f1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.55}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--navy);flex:none}
label{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;left:-9999px}

/* shell */
.app{display:flex;min-height:100%}
.rail{width:252px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 16px;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .logo{width:150px;height:auto;display:block}
.rule{height:3px;background:linear-gradient(90deg,var(--gold) 0 50%,var(--lime) 50% 100%);border-radius:2px}
.role{display:flex;flex-direction:column;gap:6px}
.role span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a9b5cf}
.role select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.role select option{color:#12234F}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:#c9d2e6;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(191,196,50,.16);color:#fff}
.nav button[aria-current="page"] svg{color:var(--lime)}
.nav .badge{margin-left:auto;background:var(--lime);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:6px 0}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--lime);color:var(--navy)}
.me small{display:block;color:#a9b5cf;font-size:12px}
.proto{font-size:11px;color:#8e9bb8;line-height:1.4}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:28px 32px 40px;max-width:1320px;width:100%;margin:0 auto}
.tabs{display:none}
@media (max-width:900px){
  .rail{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20;border-bottom:3px solid var(--lime)}
  .topbar .logo{height:34px;width:auto}
  .topbar .who{font-size:12px;color:#c9d2e6;text-align:right;line-height:1.3}
  .content{padding:18px 16px 110px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px;min-height:48px;position:relative}
  .tabs button[aria-current="page"]{color:var(--fg)}
  .tabs button[aria-current="page"] svg{color:var(--sel)}
  .tabs .dot{position:absolute;top:4px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--lime);border:2px solid var(--surface)}
}

/* common */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.title{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.title em{font-family:var(--display);font-style:normal;font-weight:400}
.sub{color:var(--muted);margin:4px 0 0;max-width:66ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.two.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1080px){.two,.two.even{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sel);color:var(--surface);border-color:var(--sel)}
.btn.lime{background:var(--lime);color:#12234F;border-color:var(--lime)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
button.chip{min-height:30px}
button.chip[aria-pressed="true"]{background:var(--sel);color:var(--surface);border-color:var(--sel)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.lime{background:var(--chip);color:var(--chip-fg);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sample{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sample::before{content:"";width:8px;height:8px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--gold) 0 2px,transparent 2px 4px)}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.opt-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.desk-only{display:none}
@media (max-width:900px){.desk-only{display:block}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{font-style:normal;font-size:12px;font-weight:700;color:var(--ok)}
.feed{display:flex;flex-direction:column;gap:10px}
.feed-item{display:flex;gap:10px;font-size:13px;align-items:flex-start}
.feed-item time{color:var(--muted);flex:none;width:64px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.r,th.r{text-align:right}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1080px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.score{background:var(--navy);color:#fff;border-radius:var(--r);padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.score .ring{width:92px;height:92px}
.score h2{font-size:15px;font-weight:600;color:#c9d2e6}
.score .pts{font-size:34px;font-weight:800;letter-spacing:-.02em}
.score .lvl{color:var(--lime);font-weight:700}
.score .streak{font-size:12px;color:#c9d2e6;margin-top:8px}
.nudge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.nudge:first-child{border-top:0;padding-top:4px}
.nudge .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.ic.hot{background:var(--bad-bg);color:var(--bad)}
.ic.due{background:var(--warn-bg);color:var(--warn)}
.ic.cal{background:var(--chip);color:var(--chip-fg)}
.nudge h3{font-size:14px;font-weight:700}
.nudge p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.nudge.done{opacity:.6}
.nudge.done h3{text-decoration:line-through}
.lead-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.lead-row:first-child{border-top:0;padding-top:2px}
.lead-row b{font-size:14px}
.lead-row small{display:block;color:var(--muted);font-size:12px}
.lead-row .acts{grid-column:1 / -1}
.vw{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.vw:first-child{border-top:0;padding-top:2px}
.vw .date{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;text-align:center;padding:4px 0;line-height:1.15}
.vw .date b{display:block;font-size:18px}
.vw .date span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.lb-row{display:grid;grid-template-columns:24px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0}
.lb-row.me-row{background:var(--chip);margin:0 -10px;padding:8px 10px;border-radius:10px;border-top-color:transparent}
.lb-row .rank{font-weight:800;color:var(--muted);text-align:center}
.lb-row .avatar{width:32px;height:32px;font-size:12px}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1080px){.studio{grid-template-columns:minmax(0,1fr)}}
.listings{display:flex;flex-direction:column;gap:10px;max-height:820px;overflow:auto;padding:2px}
@media (max-width:1080px){.listings{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:8px;scroll-snap-type:x mandatory}}
.lcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
@media (max-width:1080px){.lcard{grid-template-columns:minmax(0,1fr);width:220px;flex:none;scroll-snap-align:start}}
.lcard[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 3px rgba(191,196,50,.55)}
.lcard .ph{aspect-ratio:4/3;border-radius:8px;overflow:hidden}
.lcard b{display:block;font-size:13px}
.lcard small{display:block;color:var(--muted);font-size:12px}
.lcard .price{font-weight:800;font-size:14px;margin-top:2px;display:block}
.lcard .why{display:block;margin-top:4px;font-size:11px;font-weight:700;color:var(--chip-fg);background:var(--chip);border-radius:6px;padding:2px 6px}
.rec-h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:2px 0 -2px}
.ph{background:linear-gradient(135deg,#12234F,#1c3163);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .fallback{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:radial-gradient(circle at 80% 20%,rgba(191,196,50,.35),transparent 55%),linear-gradient(135deg,#12234F,#1c3163)}
.ph.noimg .fallback{display:flex}
.post .fallback,.mini .fallback{font-size:0}
.ph.noimg img{display:none}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--muted);transition:background .15s,border-color .15s}
.dropzone.over{border-color:var(--lime);background:var(--chip)}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1240px){.workbench{grid-template-columns:minmax(0,1fr)}}
.opts{display:flex;flex-direction:column;gap:14px}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line);min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-height:470px;overflow:auto;padding:2px}
.lgrid .lcard{grid-template-columns:minmax(0,1fr);width:auto}

/* post templates — fixed brand colours on purpose */
.post{width:100%;max-width:380px;aspect-ratio:1/1;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 12px 30px rgba(18,35,79,.25);font-family:var(--font);color:#fff;background:#12234F;flex:none}
.post.reel{aspect-ratio:9/16;max-width:270px}
.post .ph{position:absolute;top:0;left:0;right:0;bottom:0}
.post .plogo{height:24px;width:auto;display:block}
.ribbon{position:absolute;top:14px;right:-36px;transform:rotate(45deg);background:#C7A233;color:#12234F;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:5px 40px;z-index:2}
.t-frame .ph{bottom:30%}
.t-frame .band{position:absolute;left:0;right:0;bottom:0;height:30%;background:#12234F;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-top:4px solid #BFC432}
.t-frame .band .loc{font-size:22px;font-weight:800;letter-spacing:-.01em}
.t-frame .band .meta{font-size:12px;color:#d9dee6}
.t-frame .band .pr{position:absolute;right:16px;top:-22px;background:#BFC432;color:#12234F;font-weight:800;padding:8px 12px;font-size:15px;border-radius:3px}
.t-frame .tag{position:absolute;top:12px;left:12px;background:rgba(18,35,79,.85);padding:6px 9px;border-radius:3px}
.shade{position:absolute;top:0;left:0;right:0;bottom:0}
.t-bleed .shade{background:linear-gradient(180deg,rgba(18,35,79,0) 35%,rgba(18,35,79,.92) 100%)}
.t-bleed .txt{position:absolute;left:18px;right:18px;bottom:18px}
.kick{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#BFC432}
.t-bleed .loc{font-family:var(--display);font-size:34px;line-height:1.05;margin-top:4px}
.t-bleed .rl{height:3px;width:56px;background:#C7A233;margin:10px 0}
.t-bleed .meta{font-size:12px;color:#e6eaf2;display:flex;justify-content:space-between;align-items:center;gap:8px}
.t-bleed .meta b{font-size:16px;color:#fff}
.t-bleed .tl{position:absolute;top:14px;left:14px}
.t-edit{background:#f7f5ef!important;color:#12234F!important}
.t-edit .ph{top:14px;left:14px;right:14px;bottom:38%;border-radius:2px}
.t-edit .txt{position:absolute;left:18px;right:18px;bottom:16px}
.t-edit .loc{font-family:var(--display);font-size:30px;line-height:1}
.t-edit .meta{font-size:12px;color:#38425a;margin-top:6px}
.t-edit .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;border-top:2px solid #C7A233;padding-top:8px}
.t-edit .foot b{font-size:16px}
.t-edit .mk{background:#12234F;padding:4px 6px;border-radius:2px}
.t-excl .ph{top:0;left:0;right:0;bottom:0}
.t-excl .shade{background:linear-gradient(180deg,rgba(18,35,79,.15),rgba(18,35,79,.05) 40%,rgba(18,35,79,.95))}
.t-excl .frame{position:absolute;top:12px;left:12px;right:12px;bottom:12px;border:1.5px solid rgba(199,162,51,.9)}
.t-excl .txt{position:absolute;left:26px;right:26px;bottom:26px;text-align:center}
.t-excl .ex{font-size:11px;font-weight:800;letter-spacing:.3em;color:#C7A233}
.t-excl .loc{font-family:var(--display);font-size:32px;line-height:1.05;margin:6px 0}
.t-excl .meta{font-size:12px;color:#e6eaf2}
.t-excl .top{position:absolute;top:24px;left:0;right:0;display:flex;justify-content:center}
.t-li .shade{background:linear-gradient(90deg,rgba(18,35,79,.95) 0 46%,rgba(18,35,79,.1) 80%)}
.t-li .txt{position:absolute;left:18px;top:18px;bottom:18px;width:54%;display:flex;flex-direction:column;justify-content:space-between}
.t-li .q{font-family:var(--display);font-size:26px;line-height:1.08}
.t-li .q i{font-style:normal;color:#BFC432}
.t-li small{font-size:11px;color:#d9dee6}
.reel .ph img{animation:kb 9s ease-in-out infinite alternate;transform-origin:60% 40%}
.reel .scene{position:absolute;left:16px;right:16px;bottom:48px;opacity:0}
.reel.playing .s1{animation:sc 9s infinite 0s}
.reel.playing .s2{animation:sc 9s infinite 3s}
.reel.playing .s3{animation:sc 9s infinite 6s}
.reel:not(.playing) .s1{opacity:1}
.reel .shade{background:linear-gradient(180deg,rgba(18,35,79,.35),rgba(18,35,79,0) 30%,rgba(18,35,79,.85))}
.reel .big{font-family:var(--display);font-size:32px;line-height:1.05}
.reel .lm{color:#BFC432;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.reel .pill{display:inline-block;background:#BFC432;color:#12234F;font-weight:800;padding:6px 10px;font-size:18px;border-radius:3px;margin-top:8px}
.reel .top{position:absolute;top:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.reel .prog{position:absolute;left:12px;right:12px;top:6px;height:3px;display:flex;gap:4px}
.reel .prog i{flex:1;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;position:relative}
.reel.playing .prog i::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;transform-origin:left;animation:pg 9s linear infinite}
.reel.playing .prog i:nth-child(2)::after{animation-delay:3s}
.reel.playing .prog i:nth-child(3)::after{animation-delay:6s}
@-webkit-keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.18) translate(-3%,-2%)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.18) translate(-3%,-2%)}}
@-webkit-keyframes sc{0%{opacity:0;transform:translateY(14px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes sc{0%{opacity:0;transform:translateY(14px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes pg{0%{transform:scaleX(0)}33%{transform:scaleX(1)}33.01%,100%{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.reel .ph img,.reel.playing .scene,.reel.playing .prog i::after{animation:none}.reel .s1{opacity:1}}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
.hist-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-row .ph{width:52px;height:52px;border-radius:8px}
.hist-row b{font-size:13px;display:block}
.hist-row small{color:var(--muted);font-size:12px}
.metric{text-align:right;font-size:12px;color:var(--muted)}
.metric b{display:block;color:var(--fg);font-size:14px}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr) minmax(0,310px);height:min(780px,calc(100vh - 170px));min-height:580px;overflow:hidden;padding:0}
@media (max-width:1240px){.inbox{grid-template-columns:minmax(0,260px) minmax(0,1fr)}.inbox .side{display:none}}
@media (max-width:900px){.inbox{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}.inbox.chat-open .threads{display:none}.inbox:not(.chat-open) .convo{display:none}.inbox .side{display:flex}.inbox:not(.chat-open) .side{display:none}}
.threads{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.threads-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.wa{width:22px;height:22px;border-radius:50%;background:#25D366;display:grid;place-items:center;flex:none}
.thread{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;align-items:center;width:100%}
.thread[aria-current="true"]{background:var(--surface-2)}
.thread .avatar{width:40px;height:40px;background:var(--navy-2);color:#fff}
.thread b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread time{font-size:11px;color:var(--muted)}
.unread{width:20px;height:20px;border-radius:50%;background:#25D366;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:4px;margin-left:auto}
.convo{display:flex;flex-direction:column;min-width:0;background:var(--surface-2)}
.convo-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface)}
.convo-h .avatar{background:var(--navy-2);color:#fff}
.srcbar{padding:8px 16px;font-size:12px;background:var(--chip);color:var(--chip-fg);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap}
.msg.in{background:var(--surface);align-self:flex-start;border-top-left-radius:4px}
.msg.out{background:#dcf2d0;color:#13230d;align-self:flex-end;border-top-right-radius:4px}
:root[data-theme="dark"] .msg.out{background:#1f4a32;color:#e7f6ea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.out{background:#1f4a32;color:#e7f6ea}}
.msg time{display:block;font-size:10px;opacity:.6;text-align:right;margin-top:2px}
.msg .pcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;background:rgba(255,255,255,.7);border-radius:8px;padding:6px;margin-bottom:4px;color:#12234F;white-space:normal}
.msg .pcard .ph{width:64px;height:48px;border-radius:6px}
.sys{align-self:center;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:flex;gap:6px;align-items:center;text-align:center}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;text-align:left}
.suggest button:hover{border-color:var(--lime)}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;border-radius:999px;background:var(--surface-2)}
.side{border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--surface)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:6px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.match{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}
.match .ph{width:56px;height:56px;border-radius:8px}
.match b{font-size:13px;display:block}
.match small{font-size:12px;color:var(--muted);display:block}
.why2{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.why2 span{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--chip);color:var(--chip-fg);border-radius:4px;padding:1px 5px}

/* desk / ads / brochures / mail */
.queue-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.queue-row:first-child{border-top:0}
.queue-row b{font-size:13px}
.queue-row small{display:block;font-size:12px;color:var(--muted)}
.queue-row.new{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--chip)}100%{background:transparent}}
.approve{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.approve:first-child{border-top:0}
.mini{width:76px;height:76px;border-radius:6px;overflow:hidden;position:relative;flex:none}
.mini .scaler{width:380px;transform:scale(.2);transform-origin:top left;position:absolute;top:0;left:0}
.mini .post{max-width:none;border-radius:0;box-shadow:none;height:380px}
.objs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:640px){.objs{grid-template-columns:minmax(0,1fr)}}
.obj{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.obj[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 3px rgba(191,196,50,.45)}
.obj b{display:block;font-size:14px}
.obj small{display:block;font-size:12px;color:var(--muted)}
.est{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.est div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.est b{display:block;font-size:18px}
.est span{font-size:12px;color:var(--muted)}
.aud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.aud:first-child{border-top:0}
.aud small{color:var(--muted);font-size:12px;display:block}
.brochure{width:100%;max-width:420px;background:#fff;color:#12234F;border-radius:6px;box-shadow:0 12px 30px rgba(18,35,79,.2);overflow:hidden;font-family:var(--font)}
.br-cover{background:#12234F;color:#fff;padding:22px 22px 18px;position:relative}
.br-cover h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin-top:12px}
.br-cover p{margin:6px 0 0;color:#d9dee6;font-size:12px}
.br-cover .rl{height:3px;background:linear-gradient(90deg,#C7A233 0 50%,#BFC432 50% 100%);position:absolute;left:0;right:0;bottom:0}
.br-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px}
.br-item{font-size:11px;line-height:1.3}
.br-item .ph{aspect-ratio:4/3;border-radius:3px;margin-bottom:5px}
.br-item b{display:block;font-size:12px}
.br-item .n{font-family:var(--display);font-size:16px;color:#C7A233;margin-right:4px}
.br-foot{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid #e4e8ee;font-size:11px;color:#5d6b7a}
.gate{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface)}
.gate h3{font-size:16px}
.email{max-width:560px;width:100%;background:#fff;color:#222b35;border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(18,35,79,.18);font-family:var(--font)}
.email .eh{background:#12234F;padding:16px 20px;border-bottom:3px solid #BFC432}
.email .eb{padding:18px 20px;font-size:14px;line-height:1.55}
.email .eb h3{font-family:var(--display);font-weight:400;font-size:26px;color:#12234F;margin-bottom:8px}
.email .ei{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;border-top:1px solid #e4e8ee;padding:12px 0}
.email .ei .ph{height:84px;border-radius:4px}
.email .ei b{color:#12234F}
.email .ecta{display:inline-block;background:#BFC432;color:#12234F;font-weight:800;padding:10px 16px;border-radius:4px;margin-top:6px}
.email .ef{background:#f4f6f9;color:#5d6b7a;font-size:11px;padding:12px 20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.cal-day{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);min-height:140px;display:flex;flex-direction:column;gap:6px}
.cal-day h3{font-size:12px;font-weight:700;color:var(--muted)}
.slot{border-radius:7px;padding:6px 8px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.slot.newslot{border-color:var(--lime);box-shadow:0 0 0 2px rgba(191,196,50,.35)}
.slot small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.plat{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.plat i{font-style:normal;font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;background:var(--chip);color:var(--chip-fg)}
.funnel{display:flex;flex-direction:column;gap:12px}
.f-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.f-bars{display:flex;flex-direction:column;gap:3px}
.f-bars i{display:block;height:9px;border-radius:3px;background:var(--sel);min-width:2px}
.f-bars i.v{background:var(--gold)}
.f-bars i.d{background:var(--lime)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* settings */
.set{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:2px}
.set .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.set b{display:block}
.set small{display:block;color:var(--muted);font-size:13px}

/* concept */
.concept{display:flex;flex-direction:column;gap:22px}
.hero-c{background:var(--navy);color:#fff;border-radius:18px;padding:28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:900px){.hero-c{grid-template-columns:minmax(0,1fr);padding:22px}}
.hero-c h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05}
.hero-c h1 span{color:var(--lime)}
.hero-c p{color:#d3dbec;max-width:58ch}
.hero-c .mark{width:160px;height:160px;border-radius:50%;justify-self:center;border:6px solid var(--lime);object-fit:cover}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sugg .card{padding:16px}
.sugg h3{font-size:15px;margin:6px 0 4px}
.sugg p{margin:0;color:var(--muted);font-size:13px}
.who{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.flow .node{flex:1 1 170px;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.flow .node.hub{border-color:var(--lime);background:var(--chip)}
.flow .node b{display:block;font-size:14px}
.flow .node small{color:var(--muted);font-size:12px}
.flow .arrow{align-self:center;color:var(--muted);font-weight:700}
@media (max-width:640px){.flow .arrow{transform:rotate(90deg);flex-basis:100%;text-align:center}}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.phases{grid-template-columns:minmax(0,1fr)}}
.phase{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.phase .when{font-size:12px;font-weight:700;color:var(--gold)}
.phase ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.sec-h{font-size:20px;font-weight:800;margin-bottom:10px}

/* overlays */
.toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
@media (max-width:900px){.toasts{left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:#12234F;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:13px;animation:tin .25s ease}
.toast b{color:#BFC432}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,18,40,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:520px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:18px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.days button,.times button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:600;font-size:13px;line-height:1.2}
.days button span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.days button[aria-pressed="true"],.times button[aria-pressed="true"]{border-color:var(--sel);background:var(--sel);color:var(--surface)}
.days button[aria-pressed="true"] span{color:inherit}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.times button[disabled]{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.signin{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:radial-gradient(circle at 85% 10%,rgba(191,196,50,.22),transparent 40%),#12234F;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.signin .box{max-width:440px;width:100%;display:flex;flex-direction:column;gap:18px}
.signin h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.02}
.signin h1 span{color:#BFC432}
.signin p{color:#c9d2e6;margin:0}
.signin .msbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#12234F;border:0;border-radius:12px;padding:14px;font-weight:700;min-height:52px;width:100%}
.signin .roles{display:grid;gap:8px}
.signin .roles button{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:12px;padding:12px}
.signin .roles button:hover{border-color:#BFC432}
.signin .roles small{display:block;color:#a9b5cf;font-size:12px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(18,35,79,.25);border-top-color:#12234F;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

</style>
</head>
<body>

function score(c,l){var s=0,w=[];if(l.rent||!l.beds)return {s:-1,w:[]};if(l.price<=c.budget){s+=3;w.push("price")}else if(l.price<=c.budget*1.15){s+=1;w.push("near budget")}if(l.beds>=c.beds){s+=2;w.push("layout")}if(c.want.some(function(a){return l.loc.indexOf(a)>-1})){s+=3;w.push("location")}return {s:s,w:w}}
function matches(c){return LISTINGS.filter(function(l){return l.ref!==c.ref}).map(function(l){var r=score(c,l);return {l:l,s:r.s,w:r.w}}).sort(function(a,b){return b.s-a.s}).slice(0,3)}

function logFollow(id,what){
 var ld=S.leads.filter(function(l){return l.id===id})[0];
 if(what==="Not serious"){S.leads=S.leads.filter(function(l){return l.id!==id});render();toast("<b>Handed back</b> Belair Studio will check with the client");return}
 if(ld){ld.last=what+" · "+now();ld.warn=false}
 var k=chatFor(id);S.chats[k].msgs.push({sys:what+" · logged in Focus at "+now()});
 S.feed.unshift([now(),what+" logged for "+(ld?ld.n:S.chats[k].n)]);
 addPts(10,"follow-up logged");render();
}
function copyText(el,msg){
 var tx=el.value!=null?el.value:el.textContent, ok=function(){toast("<b>Copied</b> "+(msg?esc(msg):""))};
 try{navigator.clipboard.writeText(tx).then(ok,function(){sel()})}catch(_){sel()}
 function sel(){if(el.select&&document.body.contains(el)){el.focus();el.select();toast("Selected. Press Ctrl+C to copy.")}else toast(esc(msg||"Copy failed"))}
}
