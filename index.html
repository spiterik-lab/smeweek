<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belair Agent Hub</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* Layout: an app shell — navy brand rail on desktop, top bar + bottom tabs on phones; one work surface per screen. */
:root{
  --navy:#12234F; --navy-2:#1c3163; --lime:#BFC432; --gold:#C7A233; --lime-ink:#5b5f00;
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --fg:#1b2333; --muted:#596579; --line:#dde3ec;
  --accent:#12234F; --accent-fg:#ffffff; --chip:#eef0cf; --chip-fg:#4a4d00;
  --ok:#1f7a4d; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b3261e; --bad-bg:#fbe5e3;
  --shadow:0 1px 2px rgba(18,35,79,.06),0 8px 24px rgba(18,35,79,.06);
  --font:"Matter","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1228; --surface:#111c3a; --surface-2:#16224a; --fg:#e8ecf5; --muted:#a3aec4; --line:#24325a;
  --accent:#BFC432; --accent-fg:#12234F; --chip:#2b3210; --chip-fg:#dfe38a;
  --ok:#7fd3a4; --ok-bg:#163828; --warn:#f3c26b; --warn-bg:#3a2c10; --bad:#ff9a90; --bad-bg:#3f1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1228; --surface:#111c3a; --surface-2:#16224a; --fg:#e8ecf5; --muted:#a3aec4; --line:#24325a;
  --accent:#BFC432; --accent-fg:#12234F; --chip:#2b3210; --chip-fg:#dfe38a;
  --ok:#7fd3a4; --ok-bg:#163828; --warn:#f3c26b; --warn-bg:#3a2c10; --bad:#ff9a90; --bad-bg:#3f1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.rail{width:248px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 16px;gap:22px;position:sticky;top:0;height:100vh}
.rail .logo{width:150px;height:auto;display:block}
.rail-rule{height:3px;background:linear-gradient(90deg,var(--gold) 0 50%,var(--lime) 50% 100%);border-radius:2px;margin-top:-8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:#c9d2e6;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(191,196,50,.16);color:#fff}
.nav button[aria-current="page"] svg{color:var(--lime)}
.nav .badge{margin-left:auto;background:var(--lime);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--lime);color:var(--navy)}
.me small{display:block;color:#a9b5cf;font-size:12px}
.proto{font-size:11px;color:#8e9bb8;line-height:1.4}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:28px 32px 40px;max-width:1280px;width:100%;margin:0 auto}
.tabs{display:none}

@media (max-width:900px){
  .rail{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20;border-bottom:3px solid var(--lime)}
  .topbar .logo{height:34px;width:auto}
  .content{padding:18px 16px 110px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px;min-height:48px;position:relative}
  .tabs button[aria-current="page"]{color:var(--fg)}
  .tabs button[aria-current="page"] svg{color:var(--navy)}
  :root[data-theme="dark"] .tabs button[aria-current="page"] svg{color:var(--lime)}
  .tabs .dot{position:absolute;top:4px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--lime);border:2px solid var(--surface)}
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-current="page"] svg{color:var(--lime)}}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- common ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.title{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.title em{font-family:var(--display);font-style:normal;font-weight:400}
.sub{color:var(--muted);margin-top:4px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-h h2{font-size:15px;font-weight:700}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--lime);color:var(--navy);border-color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--lime);color:var(--navy);border-color:var(--lime)}}
.btn.lime{background:var(--lime);color:var(--navy);border-color:var(--lime)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.lime{background:var(--chip);color:var(--chip-fg);border-color:transparent}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sample{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sample::before{content:"";width:8px;height:8px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--gold) 0 2px,transparent 2px 4px)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* ---------- home ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1080px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.score{background:var(--navy);color:#fff;border-radius:var(--r);padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;position:relative;overflow:hidden}
.score .ring{width:92px;height:92px}
.score h2{font-size:15px;font-weight:600;color:#c9d2e6}
.score .pts{font-size:34px;font-weight:800;letter-spacing:-.02em}
.score .lvl{color:var(--lime);font-weight:700}
.score .bar{height:6px;background:rgba(255,255,255,.14);border-radius:4px;margin-top:8px;overflow:hidden}
.score .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--lime));border-radius:4px;transition:width .6s ease}
.score .streak{font-size:12px;color:#c9d2e6;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{font-style:normal;font-size:12px;font-weight:700;color:var(--ok)}
.nudge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.nudge:first-child{border-top:0;padding-top:4px}
.nudge .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.nudge .ic.hot{background:var(--bad-bg);color:var(--bad)}
.nudge .ic.due{background:var(--warn-bg);color:var(--warn)}
.nudge .ic.cal{background:var(--chip);color:var(--chip-fg)}
.nudge h3{font-size:14px;font-weight:700}
.nudge p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.nudge .acts{display:flex;flex-wrap:wrap;gap:6px}
.nudge.done{opacity:.6}
.nudge.done h3{text-decoration:line-through}
.lb{display:flex;flex-direction:column}
.lb-row{display:grid;grid-template-columns:24px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0}
.lb-row.me-row{background:var(--chip);margin:0 -10px;padding:8px 10px;border-radius:10px;border-top-color:transparent}
.lb-row .rank{font-weight:800;color:var(--muted);text-align:center}
.lb-row .avatar{width:32px;height:32px;font-size:12px}
.feed{display:flex;flex-direction:column;gap:10px}
.feed-item{display:flex;gap:10px;font-size:13px}
.feed-item time{color:var(--muted);flex:none;width:44px}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1080px){.studio{grid-template-columns:minmax(0,1fr)}}
.mode{margin-bottom:12px}
.listings{display:flex;flex-direction:column;gap:10px;max-height:760px;overflow:auto;padding:2px}
@media (max-width:1080px){.listings{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:8px;scroll-snap-type:x mandatory}}
.lcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
@media (max-width:1080px){.lcard{grid-template-columns:minmax(0,1fr);width:210px;flex:none;scroll-snap-align:start}}
.lcard[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 3px rgba(191,196,50,.55)}
:root[data-theme="dark"] .lcard[aria-pressed="true"]{border-color:var(--lime)}
.lcard .ph{aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;max-width:100%}
.lcard b{display:block;font-size:13px}
.lcard small{display:block;color:var(--muted);font-size:12px}
.lcard .price{font-weight:800;font-size:14px;margin-top:2px}
.ph{background:linear-gradient(135deg,var(--navy),var(--navy-2));position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .fallback{position:absolute;inset:0;display:none;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:radial-gradient(circle at 80% 20%,rgba(191,196,50,.35),transparent 55%),linear-gradient(135deg,var(--navy),var(--navy-2))}
.ph.noimg .fallback{display:flex}
.ph.noimg img{display:none}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px;color:var(--muted);transition:background .15s,border-color .15s}
.dropzone.over{border-color:var(--lime);background:var(--chip)}
.workbench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1240px){.workbench{grid-template-columns:minmax(0,1fr)}}
.opts{display:flex;flex-direction:column;gap:14px}
.opt-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line)}
.checks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* post templates — fixed brand colours, do not theme */
.post{width:100%;max-width:380px;aspect-ratio:1/1;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 12px 30px rgba(18,35,79,.25);font-family:var(--font);color:#fff;background:#12234F}
.post.reel{aspect-ratio:9/16;max-width:270px}
.post .ph{position:absolute;inset:0}
.post .plogo{height:24px;width:auto;display:block}
.t-frame .ph{bottom:30%}
.t-frame .band{position:absolute;left:0;right:0;bottom:0;height:30%;background:#12234F;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-top:4px solid #BFC432}
.t-frame .band .loc{font-size:22px;font-weight:800;letter-spacing:-.01em}
.t-frame .band .meta{font-size:12px;color:#d9dee6}
.t-frame .band .pr{position:absolute;right:16px;top:-22px;background:#BFC432;color:#12234F;font-weight:800;padding:8px 12px;font-size:15px;border-radius:3px}
.t-frame .tag{position:absolute;top:12px;left:12px;background:rgba(18,35,79,.85);padding:6px 9px;border-radius:3px}
.t-bleed .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,35,79,0) 35%,rgba(18,35,79,.92) 100%)}
.t-bleed .txt{position:absolute;left:18px;right:18px;bottom:18px}
.t-bleed .kick{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#BFC432}
.t-bleed .loc{font-family:var(--display);font-size:34px;line-height:1.05;margin-top:4px}
.t-bleed .rule{height:3px;width:56px;background:#C7A233;margin:10px 0}
.t-bleed .meta{font-size:12px;color:#e6eaf2;display:flex;justify-content:space-between;align-items:center;gap:8px}
.t-bleed .meta b{font-size:16px;color:#fff}
.t-bleed .tl{position:absolute;top:14px;right:14px}
.t-edit{background:#f7f5ef!important;color:#12234F!important}
.t-edit .ph{top:14px;left:14px;right:14px;bottom:38%;border-radius:2px}
.t-edit .txt{position:absolute;left:18px;right:18px;bottom:16px}
.t-edit .loc{font-family:var(--display);font-size:30px;line-height:1}
.t-edit .meta{font-size:12px;color:#38425a;margin-top:6px}
.t-edit .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;border-top:2px solid #C7A233;padding-top:8px}
.t-edit .foot b{font-size:16px}
.t-edit .mk{background:#12234F;padding:4px 6px;border-radius:2px}
.t-li .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,35,79,.95) 0 46%,rgba(18,35,79,.1) 80%)}
.t-li .txt{position:absolute;left:18px;top:18px;bottom:18px;width:54%;display:flex;flex-direction:column;justify-content:space-between}
.t-li .q{font-family:var(--display);font-size:26px;line-height:1.08}
.t-li .q i{font-style:normal;color:#BFC432}
.t-li small{font-size:11px;color:#d9dee6}
/* reel animation */
.reel .ph img{animation:kb 9s ease-in-out infinite alternate;transform-origin:60% 40%}
.reel .scene{position:absolute;left:16px;right:16px;bottom:48px;opacity:0}
.reel.playing .s1{animation:sc 9s infinite 0s}
.reel.playing .s2{animation:sc 9s infinite 3s}
.reel.playing .s3{animation:sc 9s infinite 6s}
.reel:not(.playing) .s1{opacity:1}
.reel .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,35,79,.35),rgba(18,35,79,0) 30%,rgba(18,35,79,.85))}
.reel .big{font-family:var(--display);font-size:32px;line-height:1.05}
.reel .lime{color:#BFC432;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.reel .pill{display:inline-block;background:#BFC432;color:#12234F;font-weight:800;padding:6px 10px;font-size:18px;border-radius:3px;margin-top:8px}
.reel .top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.reel .prog{position:absolute;left:12px;right:12px;top:6px;height:3px;display:flex;gap:4px}
.reel .prog i{flex:1;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;position:relative}
.reel.playing .prog i::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:pg 9s linear infinite}
.reel.playing .prog i:nth-child(2)::after{animation-delay:3s}
.reel.playing .prog i:nth-child(3)::after{animation-delay:6s}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.18) translate(-3%,-2%)}}
@keyframes sc{0%{opacity:0;transform:translateY(14px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes pg{0%{transform:scaleX(0)}33%{transform:scaleX(1)}33.01%,100%{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.reel .ph img,.reel.playing .scene,.reel.playing .prog i::after{animation:none}.reel .s1{opacity:1}}

.caption{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:260px;overflow:auto}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
.hist{display:flex;flex-direction:column}
.hist-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-row .ph{width:52px;height:52px;border-radius:8px;overflow:hidden}
.hist-row b{font-size:13px;display:block}
.hist-row small{color:var(--muted);font-size:12px}
.metric{text-align:right;font-size:12px;color:var(--muted)}
.metric b{display:block;color:var(--fg);font-size:14px}

/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr) minmax(0,300px);height:min(760px,calc(100vh - 160px));min-height:560px;overflow:hidden;padding:0}
@media (max-width:1240px){.inbox{grid-template-columns:minmax(0,260px) minmax(0,1fr)}.inbox .side{display:none}}
@media (max-width:900px){.inbox{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}.inbox.chat-open .threads{display:none}.inbox:not(.chat-open) .convo{display:none}.inbox .side{display:block}.inbox:not(.chat-open) .side{display:none}}
.threads{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.threads-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.wa{width:22px;height:22px;border-radius:50%;background:#25D366;display:grid;place-items:center;flex:none}
.thread{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;align-items:center;width:100%}
.thread[aria-current="true"]{background:var(--surface-2)}
.thread .avatar{width:40px;height:40px;background:var(--navy-2);color:#fff}
.thread b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread time{font-size:11px;color:var(--muted)}
.unread{width:20px;height:20px;border-radius:50%;background:#25D366;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:4px;margin-left:auto}
.convo{display:flex;flex-direction:column;min-width:0;background:var(--surface-2)}
.convo-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface)}
.convo-h .avatar{background:var(--navy-2);color:#fff}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg.in{background:var(--surface);align-self:flex-start;border-top-left-radius:4px}
.msg.out{background:#dcf2d0;color:#13230d;align-self:flex-end;border-top-right-radius:4px}
:root[data-theme="dark"] .msg.out{background:#1f4a32;color:#e7f6ea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.out{background:#1f4a32;color:#e7f6ea}}
.msg time{display:block;font-size:10px;opacity:.6;text-align:right;margin-top:2px}
.msg .pcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;background:rgba(255,255,255,.65);border-radius:8px;padding:6px;margin-bottom:4px;color:#12234F}
.msg .pcard .ph{width:64px;height:48px;border-radius:6px;overflow:hidden}
.sys{align-self:center;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:flex;gap:6px;align-items:center}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;text-align:left}
.suggest button:hover{border-color:var(--lime)}
.composer{display:flex;gap:8px;padding:12px 16px calc(12px + 0px);border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--surface-2)}
.side{border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.match{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}
.match .ph{width:56px;height:56px;border-radius:8px;overflow:hidden}
.match b{font-size:13px;display:block}
.match small{font-size:12px;color:var(--muted);display:block}
.why{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.why span{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--chip);color:var(--chip-fg);border-radius:4px;padding:1px 5px}

/* ---------- command ---------- */
.cc-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:1080px){.cc-grid{grid-template-columns:minmax(0,1fr)}}
.queue-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.queue-row:first-child{border-top:0}
.queue-row b{font-size:13px}
.queue-row small{display:block;font-size:12px;color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:12px}
.f-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.f-bars{display:flex;flex-direction:column;gap:3px}
.f-bars i{display:block;height:9px;border-radius:3px;background:var(--navy);min-width:2px}
:root[data-theme="dark"] .f-bars i{background:#7f93c8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .f-bars i{background:#7f93c8}}
.f-bars i.v{background:var(--gold)}
.f-bars i.d{background:var(--lime)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.cal-day{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);min-height:120px;display:flex;flex-direction:column;gap:6px}
.cal-day h3{font-size:12px;font-weight:700;color:var(--muted)}
.slot{border-radius:7px;padding:6px 8px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-left-width:1px}
.slot small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.slot .plat{display:flex;gap:4px;margin-top:4px}
.slot .plat i{font-style:normal;font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;background:var(--chip);color:var(--chip-fg)}
.frozen{display:inline-flex;align-items:center;gap:6px}
.approve{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.approve:first-child{border-top:0}
.approve .mini{width:72px;height:72px;border-radius:6px;overflow:hidden;position:relative}
.approve .mini .post{position:absolute;inset:0;max-width:none;border-radius:0;box-shadow:none;transform-origin:top left}

/* ---------- concept ---------- */
.concept{display:flex;flex-direction:column;gap:22px}
.hero-c{background:var(--navy);color:#fff;border-radius:18px;padding:28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center;overflow:hidden;position:relative}
@media (max-width:900px){.hero-c{grid-template-columns:minmax(0,1fr);padding:22px}}
.hero-c h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05}
.hero-c h1 span{color:var(--lime)}
.hero-c p{color:#d3dbec;max-width:56ch}
.hero-c .mark{width:160px;height:160px;border-radius:50%;justify-self:center;border:6px solid var(--lime);object-fit:cover}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sugg .card{padding:16px}
.sugg h3{font-size:15px;margin:6px 0 4px}
.sugg p{margin:0;color:var(--muted);font-size:13px}
.sugg .who{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.flow .node{flex:1 1 160px;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.flow .node.hub{border-color:var(--lime);background:var(--chip)}
.flow .node b{display:block;font-size:14px}
.flow .node small{color:var(--muted);font-size:12px}
.flow .arrow{align-self:center;color:var(--muted);font-weight:700}
@media (max-width:640px){.flow .arrow{transform:rotate(90deg);flex-basis:100%;text-align:center}}
.opts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.opts3{grid-template-columns:minmax(0,1fr)}}
.opts3 .card{padding:16px}
.opts3 ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.phases{grid-template-columns:minmax(0,1fr)}}
.phase{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.phase .when{font-size:12px;font-weight:700;color:var(--gold)}
.phase ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.api{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.api div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface)}
.api code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--fg);background:var(--surface-2);padding:1px 6px;border-radius:4px}
.sec-h{font-size:20px;font-weight:800;margin-bottom:10px}

/* toast */
.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
@media (max-width:900px){.toasts{left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:13px;animation:tin .25s ease}
.toast b{color:var(--lime)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,40,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:420px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
</style>
</head>

/* ---------- concept ---------- */
function vConcept(){
 var sug=[
  ["Agents","One home, one login","Agents open Focus and land on their own page: leads, nudges, marketing and messages. No more jumping between Focus, Instagram, SharePoint and Agent Leaders."],
  ["Agents","A marketing studio on each agent's page","Pick a listing, get on-brand posts, a short reel and captions per platform. Every campaign is kept with its reach and enquiries, as David asked."],
  ["Brand","Brand rules built in","Logo, colours, price format and the LinkedIn no-price rule are applied automatically. Off-brand ChatGPT posts with the Belair logo stop at the source."],
  ["Brand","Designs that rotate","Three or more layouts rotate so followers don't see the same design twice in a row. This tackles the scroll fatigue the social audit found."],
  ["Lettings","Lettings get the same tools","Letting agents finally get marketing support, within the Belair brand, instead of working on their own pages."],
  ["Follow-up","Nudges, then reassignment","If an agent doesn't update a lead, they get a WhatsApp nudge. After three, the coordinator calls the client and can reassign. No policing needed."],
  ["Follow-up","Company WhatsApp numbers","Each agent works from a Belair WhatsApp Business number. Conversations log to the client in Focus and stay with Belair if the agent leaves."],
  ["Data","Lead source on every deal","A deal can't close without a recorded source. Within a quarter, Belair knows which spend actually sells property."],
  ["Motivation","Points and a leaderboard","Agents earn points for fast replies, logged viewings and recorded lead sources. The behaviour Belair needs becomes the game agents play."],
  ["Management","Command centre for Sharone and David","Sharone reviews overnight enquiries and approvals in minutes. David sees sources, conversion and follow-up at a glance."]
 ];
 return '<div class="concept"><section class="hero-c"><div><div class="eyebrow" style="color:var(--lime)">Proposal for David Aquilina and Focus</div><h1 style="margin-top:8px">Belair Agent Hub: <span>one place</span> where agents sell</h1><p>Agents should spend their time with clients, not with forms. The Hub sits inside Focus as each agent\'s home page. It uses Focus as the single source of truth, and AI does the admin: matching, marketing, logging and chasing.</p><div class="row" style="flex-wrap:wrap;margin-top:14px"><button type="button" class="btn lime" data-go="home">Try it as Martina</button><button type="button" class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" data-go="command">See the command centre</button></div></div><img class="mark" src="'+MARK+'" alt=""></section>'+
 '<section><h2 class="sec-h">Suggestions</h2><div class="sugg">'+sug.map(function(s){return '<div class="card"><div class="who">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div>'}).join("")+'</div></section>'+
 '<section><h2 class="sec-h">How it connects</h2><div class="flow"><div class="node"><b>Focus (Realty)</b><small>Listings, photos, clients, deals, commissions. The database stays the brain.</small></div><span class="arrow" aria-hidden="true">→</span><div class="node"><b>Secure connector</b><small>API or MCP built by Focus, exposing only the fields each task needs (GDPR).</small></div><span class="arrow" aria-hidden="true">→</span><div class="node hub"><b>Agent Hub + AI</b><small>Studio, inbox, nudges, matching, brand checks.</small></div><span class="arrow" aria-hidden="true">→</span><div class="node"><b>Channels</b><small>Facebook, Instagram, LinkedIn, WhatsApp Business, website blog.</small></div></div></section>'+
 '<section><h2 class="sec-h">What Focus would need to open up</h2><div class="api"><div><code>listings.read</code> Listings with photos, price, layout, location</div><div><code>clients.search</code> Ownership check before assigning</div><div><code>clients.create</code> Buyer profile from an enquiry</div><div><code>clients.assign</code> Roster assignment and reassignment</div><div><code>activity.log</code> Calls, messages, viewings against a client</div><div><code>deals.close</code> With a required lead-source field</div><div><code>events.new_enquiry</code> A trigger the moment an enquiry lands</div><div><code>campaigns.log</code> Posts per listing and agent, with results</div></div></section>'+
 '<section><h2 class="sec-h">Three ways to build it</h2><div class="opts3"><div class="card"><div class="who" style="color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Option A</div><h3 style="margin:6px 0">Inside Realty</h3><p class="muted" style="margin:0;font-size:13px">Focus builds the Hub screens into Realty and calls AI through its existing integration.</p><ul><li>One login, as David wants</li><li>Depends on Focus\'s build time</li><li>Cost: Focus development plus AI usage</li></ul></div><div class="card"><div class="who" style="color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Option B</div><h3 style="margin:6px 0">Separate Belair app</h3><p class="muted" style="margin:0;font-size:13px">A Belair-branded app for phone and desktop, talking to Focus through the connector.</p><ul><li>Fastest to try and change</li><li>A second login unless Focus adds single sign-on</li><li>Cost: app build plus the connector</li></ul></div><div class="card" style="border-color:var(--lime)"><div class="who" style="color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Option C · suggested</div><h3 style="margin:6px 0">Hybrid</h3><p class="muted" style="margin:0;font-size:13px">Start with the connector and back-office automation now. Pilot the studio and inbox with a few agents, then decide where they live.</p><ul><li>Quick wins without waiting</li><li>Learns what agents really use before a big spend</li><li>Avoids the €10k nobody uses</li></ul></div></div></section>'+
 '<section><h2 class="sec-h">Suggested phasing</h2><div class="phases"><div class="phase"><div class="when">Quick wins · first 6 weeks</div><b>Admin off people\'s plates</b><ul><li>Overnight enquiry handling</li><li>Trevor\'s report on live Focus data</li><li>WhatsApp nudges to agents</li><li>Studio for Sharone\'s Belair pages</li></ul></div><div class="phase"><div class="when">Phase 2 · next 2 months</div><b>Agents and lettings</b><ul><li>Studio on agent pages with approvals</li><li>Lettings mode</li><li>Lead source required at closing</li></ul></div><div class="phase"><div class="when">Phase 3 · after review</div><b>The full Hub</b><ul><li>Company WhatsApp inbox in Focus</li><li>Points and leaderboard</li><li>Decision on Agent Leaders</li></ul></div></div></section>'+
 '<section class="card" style="padding:18px"><h2 class="sec-h" style="font-size:16px">To decide together</h2><ul style="margin:0;padding-left:18px;color:var(--muted)"><li>Option A, B or C, once Focus shares its options and costs</li><li>Who pays for AI usage: a company allowance with top-ups, or a licence per agent</li><li>Company WhatsApp Business numbers for every agent</li><li>Which agents pilot the studio first</li></ul></section></div>';
}

function addPts(n,why){S.points+=n;toast('<b>+'+n+' pts</b> '+esc(why))}

function bindDnD(){
 var drop=document.getElementById("drop");
 document.querySelectorAll(".lcard").forEach(function(c){c.addEventListener("dragstart",function(e){try{e.dataTransfer.setData("text/plain",c.getAttribute("data-sel"))}catch(_){}})});
 drop.addEventListener("dragover",function(e){e.preventDefault();drop.classList.add("over")});
 drop.addEventListener("dragleave",function(){drop.classList.remove("over")});
 drop.addEventListener("drop",function(e){e.preventDefault();var r=e.dataTransfer.getData("text/plain");if(r){S.sel=r;render();toast("<b>Added</b> "+esc(L(r).loc)+" to your campaign")}});
}
function sendMsg(text,pc){
 var c=S.chats[S.chat];if(!text&&!pc)return;
 c.msgs.push({d:"out",t:text||"",pc:pc,at:now()});
 var first=!c.replied;c.replied=true;
 c.msgs.push({sys:"Logged to "+c.n.split(" ")[0]+"'s record in Focus"});
 render();
 if(first&&S.chat==="emma"){addPts(10,"replied within the hour");S.done.n1="Replied at "+now()+". Logged in Focus.";}
 var replies={emma:["Thursday at 5pm works for us!","Great, thank you. The second one looks lovely too."],jonas:["Tack! The Balzan penthouse looks perfect. Can I see it Monday?","Yes, I'm open to some work if the price is right."],whit:["Lovely, thank you Martina.","Great, see you Thursday."],paolo:["Perfetto. Can we see it on Saturday?","Yes please, send the photos."]}[S.chat];
 setTimeout(function(){c.msgs.push({d:"in",t:replies[(c.msgs.length)%2],at:now()});if(S.view==="inbox")render()},1600);
}

document.addEventListener("click",function(e){
 var t=e.target.closest("button,[data-go]");if(!t)return;
 var g=t.getAttribute("data-go");if(g){go(g);return}
 var a;
 if((a=t.getAttribute("data-sel"))){S.sel=a;S.gen++;if(S.rotate)S.tpl=(S.tpl+1)%3;render();return}
 if((a=t.getAttribute("data-fmt"))){S.fmt=a;S.capTab=a;render();return}
 if((a=t.getAttribute("data-tpl"))){S.tpl=+a;render();return}
 if((a=t.getAttribute("data-cap"))){S.capTab=a;render();return}
 if((a=t.getAttribute("data-mode"))){S.lettings=a==="let";render();return}
 if((a=t.getAttribute("data-chat"))){S.chat=a;S.chats[a].unread=0;S.chatOpen=true;render();return}
 if((a=t.getAttribute("data-sug"))){var inp=document.getElementById("msgin");inp.value=S.chats[S.chat].sugg[+a];inp.focus();return}
 if((a=t.getAttribute("data-send"))){sendMsg("",a);return}
 if((a=t.getAttribute("data-cc"))){S.cc=a;render();return}
 if((a=t.getAttribute("data-fix"))){var o=S.overnight[+a];o.fix=false;o.k="ok";o.r="Matched to 818017 Sliema, assigned to Luke F.";render();toast("<b>Resolved</b> Mia Chen assigned");return}
 if((a=t.getAttribute("data-appr"))){var ap=S.approvals.filter(function(x){return x.id===a})[0];S.approvals=S.approvals.filter(function(x){return x.id!==a});S.campaigns.forEach(function(c){if(c.aid===a)c.st="Approved, posts 18:00"});render();toast("<b>Approved</b> "+esc(ap.by.split(" ")[0])+"'s post is scheduled");return}
 if((a=t.getAttribute("data-rej"))){var rj=S.approvals.filter(function(x){return x.id===a})[0];S.approvals=S.approvals.filter(function(x){return x.id!==a});S.campaigns.forEach(function(c){if(c.aid===a)c.st="Sent back by Sharone"});render();toast("<b>Sent back</b> with a note to "+esc(rj.by.split(" ")[0]));return}
 if((a=t.getAttribute("data-act"))){
  var p=a.split(":");
  if(p[0]==="reply"){S.chat=p[1];S.chats[p[1]].unread=0;S.chatOpen=true;go("inbox");return}
  if(p[0]==="studio"){S.sel=p[1];S.lettings=false;S.tpl=(S.tpl+1)%3;go("studio");return}
  if(p[0]==="log"){S.done[p[1]]=p[2]+" · logged in Focus at "+now();addPts(p[2]==="Viewing booked"?25:10,p[2].toLowerCase()+" logged");render();return}
  if(p[0]==="drop"){S.done[p[1]]="Handed back. Sharone will call the client and reassign if they're still looking.";render();toast("<b>Handed back</b> to the coordinator");return}
  if(p[0]==="remind"){S.done[p[1]]="Reminder sent on WhatsApp with the location pin at "+now()+".";render();toast("<b>Sent</b> reminder to the Whitfields");return}
  if(a==="play"){S.playing=!S.playing;render();return}
  if(a==="regen"){var cap=document.getElementById("cap");var txt=cap.textContent;cap.textContent="";cap.classList.add("typing");var i=0;var iv=setInterval(function(){i+=6;cap.textContent=txt.slice(0,i);if(i>=txt.length){clearInterval(iv);cap.classList.remove("typing")}},16);return}
  if(a==="copy"){var tx=document.getElementById("cap").textContent;var ok=function(){toast("<b>Copied</b> caption")};try{navigator.clipboard.writeText(tx).then(ok,function(){selectCap()})}catch(_){selectCap()}return}
  if(a==="mine"||a==="approval"){var l=L(S.sel),f=FMTS.filter(function(x){return x[0]===S.fmt})[0][1];
   if(a==="mine"){S.campaigns.unshift({ref:S.sel,fmt:f,when:"Today "+now(),reach:0,enq:0,st:"Live"});toast("<b>Posted</b> "+esc(l.loc)+" to your pages. Results will appear here.");}
   else{var id="a"+Date.now();S.approvals.unshift({id:id,by:"Martina Borg",ref:S.sel,fmt:f,tpl:S.tpl});S.campaigns.unshift({ref:S.sel,fmt:f,when:"Today "+now(),reach:0,enq:0,st:"Waiting for Sharone",aid:id});toast("<b>Sent</b> to Sharone. Open Command centre to approve it as her.");}
   if(S.rotate)S.tpl=(S.tpl+1)%3;render();return}
  if(a==="back"){S.chatOpen=false;render();return}
  if(a==="viewing"){var c=S.chats[S.chat];c.stage="Viewing booked";c.msgs.push({sys:"Viewing booked · added to calendar and Focus"});addPts(25,"viewing logged");render();return}
  if(a==="handback"){var c2=S.chats[S.chat];c2.stage="Handed back to coordinator";c2.msgs.push({sys:"Handed back · Sharone notified"});render();return}
 }
});

document.addEventListener("change",function(e){if(e.target.id==="rotate"){S.rotate=e.target.checked}});

else{try{var sv=localStorage.getItem("bah-view");if(sv&&["home","studio","inbox","command","concept"].indexOf(sv)>-1)S.view=sv}catch(e){}}

})();
